# SPDX-License-Identifier: Apache-2.0

name: Core build profiles

on:
  pull_request:
    branches:
      - dev/v*/v*
    paths:
      - "framework/core/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/core-build-profiles.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        profile: [embedded-minimal, full]
    runs-on: ${{ matrix.os }}
    env:
      KUNGFU_BUILDCHAIN_NO_OPTIONAL: "1"
      KUNGFU_BUILDCHAIN_SOURCE_BUILD: "1"
      SHIFU_NATIVE: "1"
      SHIFU_REQUIRE_MSVC: "1"
      KUNGFU_BUILD_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Select Linux qualification compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc-14 --version
          g++-14 --version
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install frozen workspace (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: ./shifu install --frozen-lockfile --no-optional

      - name: Install frozen workspace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\shifu.cmd install --frozen-lockfile --no-optional

      - name: Build selected Core profile (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: ./shifu rebuild:core

      - name: Build selected Core profile (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\shifu.cmd rebuild:core

      - name: Verify build identity and custom provider contract (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # shifu-entry-contract: allow direct read of the generated build identity artifact
          test "$(node -p "require('./framework/core/build/kungfu-core-build-identity.json').profile")" = "$KUNGFU_BUILD_PROFILE"
          ctest --test-dir framework/core/build -R "yijinjing_(custom_provider|fact_authority)" --output-on-failure
          # shifu-entry-contract: allow standalone external-consumer qualification outside the parent build
          node framework/core/slices/custom-provider/run.mjs

      - name: Verify build identity and custom provider contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $identity = Get-Content framework/core/build/kungfu-core-build-identity.json | ConvertFrom-Json
          if ($identity.profile -ne $env:KUNGFU_BUILD_PROFILE) { throw "build identity profile mismatch" }
          ctest --test-dir framework/core/build -R "yijinjing_(custom_provider|fact_authority)" --output-on-failure
          # shifu-entry-contract: allow standalone external-consumer qualification outside the parent build
          node framework/core/slices/custom-provider/run.mjs
