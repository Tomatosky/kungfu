# SPDX-License-Identifier: Apache-2.0

name: Build

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - alpha/v*/v*
      - release/v*/v*
  # Manual runs validate lifecycle changes (e.g. the ./shifu entrypoint
  # switch) on the full platform matrix without waiting for an alpha PR.
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: "Temporary Buildchain train or exact SHA for trusted manual validation"
        required: false
        default: ""
      platforms-json:
        description: "Optional custom platform matrix for isolated qualification reruns"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buildchain-ref == '' }}
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@v2-alpha
    secrets: inherit
    with:
      buildchain-ref: ${{ inputs.buildchain-ref || '' }}
      runner-preset: ${{ inputs.platforms-json && 'custom' || 'kungfu-v4-self-hosted' }}
      platforms-json: ${{ inputs.platforms-json || '' }}
      setup-rust: true
      rust-toolchain: "1.96.0"
      rustup-dist-server: https://rsproxy.cn
      rustup-update-root: https://rsproxy.cn/rustup
      cargo-registry-index: ${{ vars.BUILDCHAIN_CARGO_REGISTRY_INDEX }}
      artifact-name: kungfu
      artifact-paths: |
        product/release
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":1}
      require-install: true
      require-build: true
      require-verify: true
      # This workflow only fires on alpha/release PRs, so it is the recurring
      # heavy gate (kungfu has no nightly). Override the default lifecycle verify
      # (.buildchain/buildchain.toml runs quick `verify`) with the kungfu::view
      # memory-safety long-run: `--fuzz` adds the libFuzzer stage over the three
      # FlatBuffers access entries under ASan/UBSan (ADR-0039 residual risk); a
      # new crash fails verify and blocks the alpha. The ASan/UBSan corpus-replay
      # tier runs on every platform (MSVC /fsanitize=address on Windows); the
      # libFuzzer long-run is the Linux gate and soft-skips where libFuzzer is
      # absent. KUNGFU_FUZZ_SECONDS bounds the per-target run.
      #
      # An explicit verify command runs under the platform default shell and
      # does not inherit [lifecycle.env]. This Node implementation adapter sets
      # the same environment, applies the Shifu cache profile, and enters the
      # canonical shifu/shifu.cmd shim for every qualification stage without
      # assuming bash exists on Windows. Exact layer artifacts enter through
      # the registered layers.format, layers.sdk, and layers.surfaces Gates and
      # emit a source-bound receipt. On Linux it qualifies Episodes before
      # running the ADR release-admissibility gate.
      # shifu-entry-contract: allow cross-platform release qualification dispatch into the canonical shifu shim
      verify-command: node scripts/run-release-qualification.mjs
      release-candidate: true
      publish-channel: ${{ github.event_name == 'pull_request' && (startsWith(github.base_ref, 'release/') && 'release' || 'alpha') || 'none' }}
      artifact-transfer-mode: s3-to-github-artifacts
      artifact-retention-days: 14
      checkout-cache-mode: auto
      checkout-cache-mirror-url-template: ${{ vars.BUILDCHAIN_CHECKOUT_CACHE_MIRROR_URL_TEMPLATE }}
      checkout-cache-reference-repository-template: ${{ vars.BUILDCHAIN_CHECKOUT_CACHE_REFERENCE_REPOSITORY_TEMPLATE }}
      checkout-cache-fallback: github
      checkout-cache-timeout-seconds: 60
      # Custom qualification matrices can mix hosted and self-hosted runners.
      # Do not project the private-LAN runner profile onto hosted legs; use the
      # checked-in explicit-off profile so cache provenance remains auditable.
      shifu-cache-profile-ref: ${{ inputs.platforms-json && 'docs/shifu/qualification-portable-off.cache-profile.json' || vars.SHIFU_CACHE_PROFILE_REF }}
      shifu-cache-profile-digest: ${{ inputs.platforms-json && 'sha256:251ecdb33a34b770a6fbd40b0b05c5c8c0d629a06d9144e6d2d89c9c8e70258b' || vars.SHIFU_CACHE_PROFILE_DIGEST }}
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      buildchain-contract-compatibility-policy: major-compatible
      buildchain-contract-drift-issue-mode: compatible-and-breaking

  controller-evidence-train:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buildchain-ref != '' }}
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@839ab985bcf182cc8d497f95fc0fcd3b578c5296
    with:
      buildchain-ref: ${{ inputs.buildchain-ref }}
      mode: source
      upload-artifacts: true

  validate-controller-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buildchain-ref != '' }}
    needs: controller-evidence-train
    runs-on: ubuntu-24.04
    env:
      CONTROLLER_PLAN_JSON: ${{ needs.controller-evidence-train.outputs.controller-plan-json }}
      CONTROLLER_RECEIPT_JSON: ${{ needs.controller-evidence-train.outputs.controller-receipt-json }}
      EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      EXPECTED_RUNTIME_REF: ${{ inputs.buildchain-ref }}
      EXPECTED_RUNTIME_SHA: 839ab985bcf182cc8d497f95fc0fcd3b578c5296
    steps:
      - name: Checkout Buildchain runtime
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ inputs.buildchain-ref }}
          path: .buildchain/runtime
          persist-credentials: false

      - name: Validate controller receipt and consumer binding
        run: |
          mkdir -p .buildchain/controller
          printf '%s\n' "$CONTROLLER_PLAN_JSON" > .buildchain/controller/plan.json
          printf '%s\n' "$CONTROLLER_RECEIPT_JSON" > .buildchain/controller/receipt.json
          jq -e \
            --arg source_repository "$EXPECTED_SOURCE_REPOSITORY" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg runtime_ref "$EXPECTED_RUNTIME_REF" \
            --arg runtime_sha "$EXPECTED_RUNTIME_SHA" \
            '.source.repository == $source_repository and .source.sha == $source_sha and .runtime.ref == $runtime_ref and .runtime.sha == $runtime_sha' \
            .buildchain/controller/plan.json
          jq -e --slurpfile plan .buildchain/controller/plan.json \
            '.planDigest == $plan[0].digest' \
            .buildchain/controller/receipt.json
          # shifu-entry-contract: allow validate an external Buildchain plan artifact with its owning runtime
          env BUILDCHAIN_CONTROLLER_EVIDENCE_KIND=plan BUILDCHAIN_CONTROLLER_EVIDENCE_PATH=.buildchain/controller/plan.json node .buildchain/runtime/scripts/controller-evidence.mjs --mode validate
          # shifu-entry-contract: allow validate an external Buildchain receipt artifact with its owning runtime
          env BUILDCHAIN_CONTROLLER_EVIDENCE_KIND=receipt BUILDCHAIN_CONTROLLER_EVIDENCE_PATH=.buildchain/controller/receipt.json node .buildchain/runtime/scripts/controller-evidence.mjs --mode validate --require-qualifying
