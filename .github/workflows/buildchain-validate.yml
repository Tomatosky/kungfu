name: Buildchain Validate

# Preflight: validate .buildchain/buildchain.toml version-state and lifecycle declarations
# without running any lifecycle command. Fast, side-effect free.

on:
  pull_request:
  push:
    branches:
      - "dev/**"
      - "alpha/**"
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate .buildchain/buildchain.toml
        uses: kungfu-systems/buildchain/actions/validate-config@v2
        with:
          require-version-state: "true"
          require-lifecycle-stages: "install,check,build,verify"

  promotion-rehearsal:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rehearse alpha and stable promotion contracts
        run: >-
          ./shifu gate run governance.promotion-rehearsal

  # Canary the generic Buildchain control plane from a real consumer before
  # promoting it. Kungfu owns the profile and runtime requirements; Buildchain
  # derives the Gate/runner matrix from Shifu instead of hard-coding Gate ids.
  gate-profile-canary:
    if: github.event_name == 'pull_request'
    needs: validate
    uses: kungfu-systems/buildchain/.github/workflows/.gate-profile.yml@feature/gate-profile-orchestration
    with:
      gate-profile: dev-patrol
      runner-preset: kungfu-v4-self-hosted
      artifact-name: kungfu-dev-patrol-gates
      gate-command-json: >-
        {"linux":["./shifu","cache","apply","--","./shifu"],
        "macos":["./shifu","cache","apply","--","./shifu"],
        "windows":["./shifu.cmd","cache","apply","--","./shifu.cmd"]}
      gate-environment-json: >-
        {"SHIFU_NATIVE":"1","KUNGFU_BUILDCHAIN_NO_OPTIONAL":"1",
        "KUNGFU_BUILDCHAIN_SOURCE_BUILD":"1"}
      shifu-cache-profile-ref: ${{ vars.SHIFU_CACHE_PROFILE_REF }}
      shifu-cache-profile-digest: ${{ vars.SHIFU_CACHE_PROFILE_DIGEST }}
