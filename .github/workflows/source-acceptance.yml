name: Source Acceptance

on:
  pull_request:
    branches:
      - dev/v*/v*

permissions:
  contents: read

jobs:
  source-acceptance:
    name: Source acceptance
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@v2-alpha
    with:
      buildchain-ref: v2-alpha
      mode: source
      upload-artifacts: true
