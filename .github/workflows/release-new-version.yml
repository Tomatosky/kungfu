# SPDX-License-Identifier: Apache-2.0

name: Release - New Version

on:
  pull_request:
    types: [closed]
    branches:
      - alpha/v*/v*
      - release/v*/v*

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Bootstrap only
        run: |
          echo "Buildchain release promotion is intentionally disabled on the alpha workflow bootstrap PR."
